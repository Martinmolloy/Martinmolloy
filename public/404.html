.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 26px; border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none; }

.btn-primary:hover { filter: brightness(.95); }
.btn-ghost { border: 1.5px solid var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
