<style>
.ck { position: fixed; z-index: 140; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 32px)); box-sizing: border-box; padding: 18px 20px; border-radius: 16px;
  background: #121214; color: rgba(255,255,255,.82); box-shadow: 0 18px 50px rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.1);

#ckNo { background: #fff; color: #121214; }
#ckYes { background: #FE5000; color: #121214; }
.ck-btns button:hover { filter: brightness(.94); }
.ck-btns button:focus-visible, .ck a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
footer .ck-link { all: unset; cursor: pointer; color: rgba(255,255,255,.75); font-weight: 600; }

</style>
<script>
(() => {
  const KEY = 'aura-cookies', bar = document.getElementById('ckBar');
  const get = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const set = v => { try { localStorage.setItem(KEY, v); } catch {} };
  let loaded = false;
  const load = () => {
    if (loaded) return; loaded = true;
    // Leadfeeder's tracking code, as supplied
    (function(ss,ex){ window.ldfdr=window.ldfdr||function(){(ldfdr._q=ldfdr._q||[]).push([].slice.call(arguments));}; (function(d,s){ fs=d.getElementsByTagName(s)[0]; function ce(src){ var cs=d.createElement(s); cs.src=src; cs.async=1; fs.parentNode.insertBefore(cs,fs); }; ce('https://sc.lfeeder.com/lftracker_v1_'+ss+(ex?'_'+ex:'')+'.js'); })(document,'script'); })('bElvO73nrmb8ZMqj');
  };
  const forget = () => {   // withdrawing consent: remove Leadfeeder's cookies, then start clean
    const host = location.hostname, parts = host.split('.');
    document.cookie.split(';').map(c => c.split('=')[0].trim()).filter(n => /^_lf/.test(n)).forEach(n => {
      for (let i = 0; i < parts.length - 1; i++) document.cookie = n + '=; Max-Age=0; path=/; domain=.' + parts.slice(i).join('.');
      document.cookie = n + '=; Max-Age=0; path=/';
    });
    location.reload();
  };
  const choose = v => { const was = get(); set(v); bar.hidden = true; if (v === 'yes') load(); else if (was === 'yes' && loaded) forget(); };
  document.getElementById('ckYes').addEventListener('click', () => choose('yes'));
  document.getElementById('ckNo').addEventListener('click', () => choose('no'));
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-cookie-settings]')) return;
    bar.hidden = false; document.getElementById('ckNo').focus();
  });
  const c = get();
  if (c === 'yes') load(); else if (c !== 'no') bar.hidden = false;
})();
</script>
